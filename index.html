<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobileStore - Tienda de Celulares</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f7fa;
}

header{
background:#0f172a;
color:white;
padding:15px 5%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#3b82f6;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
}

.hero{
height:500px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(rgba(15,23,42,.85),rgba(15,23,42,.85)),
url('https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=1600');
background-size:cover;
color:white;
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
margin-bottom:20px;
}

.btn{
background:#2563eb;
color:white;
padding:12px 25px;
border:none;
cursor:pointer;
border-radius:8px;
}

.container{
width:90%;
max-width:1400px;
margin:auto;
padding:60px 0;
}

.title{
text-align:center;
font-size:40px;
margin-bottom:40px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card-body{
padding:20px;
}

.price{
font-size:24px;
font-weight:bold;
color:#16a34a;
margin:15px 0;
}

.cart{
position:fixed;
right:20px;
bottom:20px;
background:#2563eb;
color:white;
padding:15px;
border-radius:50px;
cursor:pointer;
font-weight:bold;
}

.cart-panel{
position:fixed;
top:0;
right:-400px;
width:400px;
height:100%;
background:white;
box-shadow:-5px 0 20px rgba(0,0,0,.2);
padding:20px;
transition:.4s;
overflow:auto;
}

.cart-panel.active{
right:0;
}

.cart-item{
border-bottom:1px solid #ddd;
padding:10px 0;
}

footer{
background:#0f172a;
color:white;
text-align:center;
padding:20px;
margin-top:50px;
}

@media(max-width:768px){

.hero h1{
font-size:35px;
}

.cart-panel{
width:100%;
}

}
</style>
</head>
<body>

<header>

<div class="logo">
📱 Mobile<span>Store</span>
</div>

<nav>
<a href="#">Inicio</a>
<a href="#">Productos</a>
<a href="#">Ofertas</a>
<a href="#">Contacto</a>
</nav>

</header>

<section class="hero">

<div>
<h1>Celulares Premium</h1>
<p>Compra los mejores smartphones al mejor precio</p>
<button class="btn">Ver Catálogo</button>
</div>

</section>

<div class="container">

<h2 class="title">Productos Destacados</h2>

<div class="products" id="products"></div>

</div>

<div class="cart" onclick="toggleCart()">
🛒 <span id="count">0</span>
</div>

<div class="cart-panel" id="cartPanel">

<h2>Carrito de Compras</h2>

<div id="cartItems"></div>

<h3 style="margin-top:20px">
Total: $<span id="total">0</span>
</h3>

</div>

<footer>
© 2026 MobileStore - Tienda Online de Celulares
</footer>

<script>

const productos = [

{
id:1,
nombre:"iPhone 16 Pro",
precio:4999900,
imagen:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=800"
},

{
id:2,
nombre:"Samsung Galaxy S25",
precio:4299900,
imagen:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=800"
},

{
id:3,
nombre:"Xiaomi 15",
precio:2999900,
imagen:"https://images.unsplash.com/photo-1580910051074-3eb694886505?w=800"
},

{
id:4,
nombre:"Honor Magic",
precio:2499900,
imagen:"https://images.unsplash.com/photo-1605236453806-6ff36851218e?w=800"
}

];

let carrito=[];

const productsContainer=document.getElementById("products");

productos.forEach(producto=>{

productsContainer.innerHTML += `

<div class="card">

<img src="${producto.imagen}">

<div class="card-body">

<h3>${producto.nombre}</h3>

<div class="price">
$${producto.precio.toLocaleString()}
</div>

<button class="btn"
onclick="agregarCarrito(${producto.id})">
Agregar al carrito
</button>

</div>

</div>

`;

});

function agregarCarrito(id){

const producto=productos.find(p=>p.id===id);

carrito.push(producto);

actualizarCarrito();

}

function actualizarCarrito(){

const cartItems=document.getElementById("cartItems");

cartItems.innerHTML="";

let total=0;

carrito.forEach(item=>{

total += item.precio;

cartItems.innerHTML += `

<div class="cart-item">

<strong>${item.nombre}</strong><br>

$${item.precio.toLocaleString()}

</div>

`;

});

document.getElementById("total").innerText=
total.toLocaleString();

document.getElementById("count").innerText=
carrito.length;

localStorage.setItem(
"carrito",
JSON.stringify(carrito)
);

}

function toggleCart(){

document
.getElementById("cartPanel")
.classList.toggle("active");

}

window.onload=()=>{

const guardado=
localStorage.getItem("carrito");

if(guardado){

carrito=JSON.parse(guardado);

actualizarCarrito();

}

}

</script>

</body>
</html>
